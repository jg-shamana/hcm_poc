name: ECR Deploy (OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        required: true
        options: [dev, prod]
        default: dev
      region:
        description: "AWS Region"
        type: choice
        required: true
        options: [ap-northeast-1]
        default: ap-northeast-1
      image_tag:
        description: "Image tag (default: git SHA)"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecr-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push to ECR (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ inputs.region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.region }}

      - name: Get AWS Account ID
        id: acct
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Determine ECR repository name
        id: repo
        run: |
          case "${{ inputs.environment }}" in
            dev)  REPO="cdk-hcm-poc-dev" ;;
            prod) REPO="cdk-hcm-poc-prod" ;;
          esac
          echo "name=$REPO" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ steps.repo.outputs.name }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
