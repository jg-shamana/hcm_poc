AWSTemplateFormatVersion: "2010-09-09"
Description: "ECS Fargate stack for HCM POC - CFN version"

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Environment name

  ProjectName:
    Type: String
    Default: cfn-hcm-poc
    Description: Project name

Mappings:
  EnvironmentMap:
    dev:
      Cpu: 256
      Memory: 512
      DesiredCount: 0
      LogRetentionDays: 7
    prod:
      Cpu: 512
      Memory: 1024
      DesiredCount: 0
      LogRetentionDays: 30

Resources:
  # ECS Cluster
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster-${Environment}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cluster-${Environment}"
        - Key: Project
          Value: HCM-POC
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Security Group for ECS Tasks
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for ECS tasks"
      VpcId: !ImportValue
        Fn::Sub: "cfn-hcm-vpc-${Environment}-vpc-id"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Allow HTTPS outbound for ECR and VPC Endpoints"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecs-sg-${Environment}"
        - Key: Project
          Value: HCM-POC
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # IAM Role for Task Execution
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-execution-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: LogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/*"

  # IAM Role for Task
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # CloudWatch Log Group
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${Environment}"
      RetentionInDays:
        !FindInMap [EnvironmentMap, !Ref Environment, LogRetentionDays]
    DeletionPolicy: !If [IsDevEnvironment, Delete, Retain]

  # CloudWatch Log Group for FireLens
  FirelensLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-firelens-${Environment}"
      RetentionInDays:
        !FindInMap [EnvironmentMap, !Ref Environment, LogRetentionDays]
    DeletionPolicy: !If [IsDevEnvironment, Delete, Retain]

  # ECS Task Definition
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - EcsExecutionRole
      - EcsTaskRole
      - EcsLogGroup
      - FirelensLogGroup
    Properties:
      Family: !Sub "${ProjectName}-task-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !FindInMap [EnvironmentMap, !Ref Environment, Cpu]
      Memory: !FindInMap [EnvironmentMap, !Ref Environment, Memory]
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        # FireLens Log Router Container
        - Name: log_router
          Image: 533243300146.dkr.ecr.ap-northeast-1.amazonaws.com/newrelic/logging-firelens-fluentbit:2.4.0
          Cpu: 50
          MemoryReservation: 50
          Essential: false
          FirelensConfiguration:
            Type: fluentbit
            Options:
              enable-ecs-log-metadata: "true"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FirelensLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: firelens
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
        # Application Container
        - Name: AppContainer
          Image: !Sub
            - "${RepositoryUri}:latest"
            - RepositoryUri: !ImportValue
                Fn::Sub: "cfn-hcm-ecr-${Environment}-repository-uri"
          Essential: true
          LogConfiguration:
            LogDriver: awsfirelens
            Options:
              Name: newrelic
              region: !Ref AWS::Region
              log_group_name: !Ref EcsLogGroup
              log_stream_prefix: app
              auto_create_group: "false"
              log_type: application
              endpoint: https://log-api.newrelic.com/log/v1
              apiKey: "${NEW_RELIC_API_KEY}" 
              enable-ecs-log-metadata: "true"
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: PROJECT_NAME
              Value: !Ref ProjectName
            - Name: PYTHONUNBUFFERED
              Value: "1"
          Secrets:
            - Name: NEW_RELIC_API_KEY
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hcm_poc:hcm-poc-dev-newrelic-api-key::"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-task-${Environment}"
        - Key: Project
          Value: HCM-POC
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ECS Service
  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - EcsCluster
      - EcsTaskDefinition
      - EcsSecurityGroup
    Properties:
      ServiceName: !Sub "${ProjectName}-service-${Environment}"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref EcsTaskDefinition
      DesiredCount: !FindInMap [EnvironmentMap, !Ref Environment, DesiredCount]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref EcsSecurityGroup
          Subnets:
            - !ImportValue
              Fn::Sub: "cfn-hcm-vpc-${Environment}-private-subnet-1-id"
            - !ImportValue
              Fn::Sub: "cfn-hcm-vpc-${Environment}-private-subnet-2-id"
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      EnableExecuteCommand: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-service-${Environment}"
        - Key: Project
          Value: HCM-POC
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Conditions:
  IsDevEnvironment: !Equals [!Ref Environment, dev]

Outputs:
  ClusterName:
    Description: "ECS Cluster name for environment"
    Value: !Ref EcsCluster
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-cluster-name"

  ClusterArn:
    Description: "ECS Cluster ARN for environment"
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-cluster-arn"

  ServiceName:
    Description: "ECS Service name for environment"
    Value: !Ref EcsService
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-service-name"

  ServiceArn:
    Description: "ECS Service ARN for environment"
    Value: !Ref EcsService
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-service-arn"

  TaskDefinitionArn:
    Description: "ECS Task Definition ARN for environment"
    Value: !Ref EcsTaskDefinition
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-task-definition-arn"

  LogGroupName:
    Description: "CloudWatch Log Group name for environment"
    Value: !Ref EcsLogGroup
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-log-group-name"

  FirelensLogGroupName:
    Description: "FireLens CloudWatch Log Group name for environment"
    Value: !Ref FirelensLogGroup
    Export:
      Name: !Sub "cfn-hcm-ecs-${Environment}-firelens-log-group-name"
